# Golden expectations for the deterministic layers (rule packs).
# Each case: a golden resume × a context (pack set) → the exact set of rule
# findings expected. The runner fails CI on any difference
# (docs/ARCHITECTURE.md §10). LLM-layer expectations arrive in Phase 1 and
# will be scored by overlap, not exactness.
#
