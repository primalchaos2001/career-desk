name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm --filter @tailorats/app exec playwright install --with-deps chromium
      - name: Browser e2e (dev server)
        run: pnpm e2e
      - name: Browser e2e (production static build)
        run: pnpm e2e:preview
