name: Release

# Push a tag like v0.2.0 to build the Windows download and attach it to a
# GitHub release. People download CareerDesk-windows.zip, unzip it and
# double-click "Career Desk.cmd"; Node is included, so nothing else to install.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_RUNTIME: "22.12.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @tailorats/app run local:build
      - name: Download portable Node for the package
        shell: pwsh
        run: |
          $v = "${{ env.NODE_RUNTIME }}"
          Invoke-WebRequest "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip" -OutFile node.zip
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/v$v/SHASUMS256.txt").Content
          $want = ($sums -split "`n" | Where-Object { $_ -match "node-v$v-win-x64.zip" }).Split(" ")[0]
          $got = (Get-FileHash node.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "Node download checksum mismatch" }
          Expand-Archive node.zip -DestinationPath node-runtime
      - run: node scripts/package-windows.mjs --node "node-runtime/node-v${{ env.NODE_RUNTIME }}-win-x64"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path release/CareerDesk -DestinationPath CareerDesk-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CareerDesk-windows.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: CareerDesk-windows
          path: CareerDesk-windows.zip
